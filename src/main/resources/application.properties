spring.application.name=learning-platform
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learning}
spring.datasource.username=${DB_USER:learning}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32
server.port=${PORT:8080}
server.error.include-message=never
app.demo.enabled=${DEMO_ENABLED:false}
app.security.enabled=${SECURITY_ENABLED:true}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@learning.local}
