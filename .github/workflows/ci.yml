name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: learning_test
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learning -d learning_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Java source quality
        run: bash gradlew checkstyleMain checkstyleTest --no-daemon
      - name: Build and run H2 integration and unit tests
        run: bash gradlew build --no-daemon
      - name: Run integration tests against PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/learning_test
          TEST_DB_USER: learning
          TEST_DB_PASSWORD: ci-only-password
        run: bash gradlew test --tests '*PlatformIntegrationTest' --rerun-tasks --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle
